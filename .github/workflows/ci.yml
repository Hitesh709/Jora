name: CI
on:
  push:
    branches:
      - main
      - 'jora/**'
  pull_request:

concurrency:
  group: jora-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
